[build-system]
requires = ["scikit-build-core", "pybind11", "numpy", "pyparsing"]
build-backend = "scikit_build_core.build"

[project]
name = "tinynav"
version = "0.1.3"
description = "minimal implementation of navigation"
requires-python = ">=3.10.12,<3.11"
authors = [{ name = "Zhenfei Yang", email = "zhenfei.yang@deepmirror.com" }]
dependencies = [
    "numpy==1.26.1", # for compatability with ros2's cv_bridge
    "scipy",
    "matplotlib",
    "opencv-python",
    "av",
    "codetiming",
    "numba==0.61.2",
    "fufpy",
    "pygame",
    "cuda_python==12.6.0; platform_machine == 'aarch64'",
    "cuda-python==12.2.0; platform_machine == 'x86_64'",
    "pybind11",
    "huggingface_hub==1.9.2",
    "einops",
    "async-lru",
    "tyro",
    "reportlab>=4.4.3",
    "tabulate",
    "plyfile",
    "viser",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pillow>=10.0.0",
    "httpx>=0.27.0",
    "tokenizers>=0.15.0",
]

[tool.scikit-build]
cmake.source-dir = "tinynav/cpp"
wheel.install-dir = "tinynav"

[dependency-groups]
dev = [
    "ruff>=0.12.3",
]

[project.optional-dependencies]
lekiwi =[
    "lerobot[lekiwi]==0.3.3",
]
unitree = [
    # Discovery-lease fix (ghost readers hold the dog's writer sessions for the
    # full 100s default): upstream PR unitreerobotics/unitree_sdk2_python#190,
    # byte-identical to deploy/patches/unitree-sdk2py-814556d-lease. Re-pin to
    # upstream once #190 merges.
    "unitree-sdk2py @ git+https://github.com/zhongyuanguo-code/unitree_sdk2_python.git@cd47a98be4b0699462ca995797169b09710a19a6",
]
3dgs = [
    "torch>=2.4,<2.11",
    "pillow>=10,<12",
    "lightglue @ git+https://github.com/cvg/LightGlue.git@746fac2c042e05d1865315b1413419f1c1e7ba55",
    "plyfile",
    "nerfstudio @ git+https://github.com/junlinp/nerfstudio.git@d69136d198beea473aaa148cbd5114d01c2f847e",
    "pymeshlab==2022.2.post4",
    "newrawpy<=1.0.0b0",
]
