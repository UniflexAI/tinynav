<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TinyNav · 规则脱困</title>
<style>
body{font:16px system-ui;background:#101827;color:#e6edf6;margin:0;padding:32px;max-width:1600px;margin:auto}a{color:#86bfff}button{background:#4277ed;color:white;border:0;padding:12px 20px;border-radius:8px;font:inherit;cursor:pointer}button:disabled{opacity:.5}pre{background:#182438;padding:20px;overflow:auto;border-radius:12px;font:13px monospace;white-space:pre-wrap;max-height:280px}h1{font-size:28px}.muted{color:#a8b5c8}#summary{font-size:20px;padding:20px 0}progress{width:180px;margin:0 10px}td{padding:6px 12px}details{margin:20px 0}
.observation-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}.scene-live{position:sticky;top:16px}.scene-live iframe{width:100%;height:780px;border:1px solid #34465c;border-radius:12px;background:#101827}.decision-content{min-width:0}@media(max-width:950px){.observation-layout{grid-template-columns:1fr}.scene-live{position:static}.scene-live iframe{height:600px}}
.recording #observer-tools,.recording #rule-evidence,.recording details{display:none}.recording .scene-live iframe{height:760px}
</style>
<a href="/">← 返回 Planning Lab</a><h1>TinyNav · 规则辅助脱困</h1>
<p class="muted">使用与机器人相同的控制节点，验证持续卡住后的扫描、退让与接管。选择场景和规则开关，再运行对照。</p>

<div class="observation-layout"><aside class="scene-live"><h2>Websim 实时场景</h2><p class="muted">与右侧实验同步 · 只读观察 · <a href="/" target="_blank" rel="noopener">单独打开场景</a></p><iframe src="/?observe=1" title="Websim 实时场景"></iframe></aside><div class="decision-content">
<section style="background:#182438;padding:20px;border-radius:12px;margin:20px 0">
<h2>规则辅助开／关对照</h2>
<div id="comparison-banner" style="font-size:24px;font-weight:700;padding:16px;background:#253950;border-radius:8px;margin-bottom:16px">等待实验</div>
<p class="muted">持续卡住 → 原地扫描 → 唯一通畅转向或长退让 → 恢复原 planner。任务目标保持不变；动作由规则选择，未调用模型。</p>
<select id="rule-scene"><option value="dead_end">1 · U 形死胡同</option><option value="l_turn">2 · L 形遮挡拐角</option><option value="s_bend">3 · S 形连续绕障</option><option value="narrow_gate">4 · 狭窄门洞</option><option value="back_target">5 · 后方目标与前方封堵</option></select>
<p id="scene-challenge" style="color:#91c9ff"></p>
<label><input id="recording-view" type="checkbox" checked> 录屏简洁模式</label><br><br>
<label>模式 <select id="rule-mode"><option value="on">开启规则辅助</option><option value="off">关闭规则辅助（原 planner）</option></select></label> <label>时限 <input id="rule-timeout" type="number" value="180" min="5" max="600" style="width:70px"> 秒</label>
<button id="rule-start" disabled>从起点开始对照运行</button> <button id="rule-stop" disabled>停止</button> <button id="rule-download">下载实验 JSON</button>
<p class="muted">每次重置相同场景、起点、目标和观测。下表仅配对相同配置与时限；耗时包含启动与扫描。</p><div id="comparison-results"></div>
<p id="rule-stage">读取实验状态…</p><pre id="rule-evidence">—</pre>
<details><summary>阶段与执行事件</summary><pre id="rule-events">—</pre></details>
</section>
<script>
const challengeScenes={dead_end:['U 形死胡同','先远离目标，退出陷阱再绕行'],l_turn:['L 形遮挡拐角','转角后的通道需要补充观测'],s_bend:['S 形连续绕障','连续改变方向，检查重复卡住与恢复'],narrow_gate:['狭窄门洞','检查车体间隙与保守碰撞判断'],back_target:['后方目标与前方封堵','目标在视野后方，需要转向补齐观测']};
function challengeDescription(){const c=challengeScenes[document.querySelector('#rule-scene').value];document.querySelector('#scene-challenge').textContent=c?c[1]:'';}
document.querySelector('#rule-scene').addEventListener('change',challengeDescription);challengeDescription();
document.body.classList.add('recording');
document.querySelector('#recording-view').onchange=e=>document.body.classList.toggle('recording',e.target.checked);
let comparisonRuns=[];
try{comparisonRuns=JSON.parse(localStorage.getItem('tinynav-native-rule-comparisons')||'[]');}catch(e){comparisonRuns=[];}
comparisonRuns=comparisonRuns.filter(r=>['arrived','timeout','collision','cancelled'].includes(r.status));
function comparisonRender(s){
 const m=s.metrics||{};
 if(s.mode==='rules'&&m.id&&['arrived','timeout','collision','cancelled'].includes(m.status)&&!comparisonRuns.some(r=>r.id===m.id)){
  comparisonRuns.push({...m,rules_enabled:s.rules_enabled!==false});comparisonRuns=comparisonRuns.slice(-40);
  try{localStorage.setItem('tinynav-native-rule-comparisons',JSON.stringify(comparisonRuns));}catch(e){}
 }
 const groups=new Map();for(const r of comparisonRuns){const key=r.config_hash+':'+r.timeout_s;const g=groups.get(key)||{scenario:r.scenario,timeout:r.timeout_s};g[r.rules_enabled?'on':'off']=r;groups.set(key,g);}
 const box=document.querySelector('#comparison-results');box.replaceChildren();
 const table=document.createElement('table');const head=table.insertRow();for(const label of ['场景 / 时限','关闭规则辅助','开启规则辅助'])head.insertCell().textContent=label;
 const describe=r=>r?`${({arrived:'到达',timeout:'超时',collision:'碰撞停止',cancelled:'手动停止'})[r.status]||r.status} · ${Number(r.elapsed_s).toFixed(1)}s · 碰撞 ${r.collision_events} · 距目标 ${Number(r.distance_to_goal_m).toFixed(2)}m`:'待运行';
 for(const g of [...groups.values()].reverse().slice(0,10)){const row=table.insertRow();row.insertCell().textContent=`${challengeScenes[g.scenario]?.[0]||g.scenario} / ${g.timeout}s`;row.insertCell().textContent=describe(g.off);row.insertCell().textContent=describe(g.on);}box.append(table);
}
async function ruleApi(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json();}
async function rulePoll(){try{
 const s=await ruleApi('/api/experiment/status'),enabled=s.mode==='rules',state=s.rule_recovery||{},m=s.metrics||{};
 document.querySelector('#rule-start').disabled=!enabled||m.status==='running';
 document.querySelector('#rule-stop').disabled=!enabled||m.status!=='running';
 for(const id of ['rule-mode','rule-scene','rule-timeout'])document.querySelector('#'+id).disabled=m.status==='running';
 const activeRules=enabled&&s.rules_enabled!==false;
 document.querySelector('#comparison-banner').textContent=enabled?`${activeRules?'开启规则辅助':'关闭规则辅助 · 仅原 planner'} ｜ ${challengeScenes[m.scenario]?.[0]||m.scenario||'未开始'} ｜ ${m.status||'idle'}`:'当前服务不支持对照';
 document.querySelector('#comparison-banner').style.background=activeRules?'#164b3c':'#473d20';
 const history=await ruleApi('/api/experiment/comparisons');
 for(const r of history.runs||[])if(['arrived','timeout','collision','cancelled'].includes(r.status)&&!comparisonRuns.some(old=>old.id===r.id))comparisonRuns.push(r);
 comparisonRuns.sort((a,b)=>a.started_at_unix-b.started_at_unix);
 comparisonRender(s);
 const names={planner_only:'原 planner 导航中',cancelled:'已停止',idle:'未开始',goal_approach:'目标附近低速收尾',goal_approach_timeout:'收尾超时，交还原 planner',watching:'观察卡住状态',scanning:'原地扫描',fresh_report:'等待扫描后新规划报告',executing:'执行退让',planner_resumed:'原 planner 已接管',arrived:'到达原任务目标',collision:'碰撞，运行停止',timeout:'运行超时',attempt_limit:'达到脱困尝试上限',no_observed_candidate:'没有符合完整观测条件的动作',scan_aborted:'扫描中止'};
 document.querySelector('#rule-stage').textContent=enabled?`${activeRules?'规则辅助':'仅原 planner'} · ${names[state.phase]||state.phase} · 耗时 ${m.elapsed_s||0}s · 碰撞 ${m.collision_events||0} · 扫描 ${Math.min(360,state.scan?.rotation_deg??[...(s.events||[])].reverse().find(e=>e.event==='scan_completed')?.rotation_deg??0).toFixed(1)}°`:`当前服务模式：${s.mode}。规则辅助只在隔离 rules 服务可用。`;
 document.querySelector('#rule-evidence').textContent=JSON.stringify({decision_source:enabled?(activeRules?'rule':'planner'):'未启用',model_used:false,mission_result:m.status||'未开始',distance_to_original_goal_m:m.distance_to_goal_m,selection:state.selection,execution:s.active_strategy,attempts:s.attempts},null,2);
 document.querySelector('#rule-events').textContent=JSON.stringify((s.events||[]).slice(-30),null,2);
}catch(e){document.querySelector('#rule-stage').textContent='状态读取失败：'+e.message;}}
document.querySelector('#rule-start').onclick=async()=>{try{const id=document.querySelector('#rule-scene').value,all=await ruleApi('/api/baseline/scenarios'),scene=all.scenarios[id],config=await ruleApi('/api/default-config');Object.assign(config,{scenario_id:id,name:scene.label,start:scene.start,target:scene.target,objects:scene.objects});config.camera.max_range=scene.cameraMaxRange;await ruleApi('/api/baseline/start',{config,timeout_s:Number(document.querySelector('#rule-timeout').value),rules_enabled:document.querySelector('#rule-mode').value==='on'});await rulePoll();}catch(e){document.querySelector('#rule-stage').textContent='启动失败：'+e.message;}};
document.querySelector('#rule-stop').onclick=async()=>{await ruleApi('/api/baseline/stop',{});await rulePoll();};
document.querySelector('#rule-download').onclick=async()=>{const s=await ruleApi('/api/experiment/status'),url=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='rules-experiment.json';a.click();URL.revokeObjectURL(url);};
rulePoll();setInterval(rulePoll,1000);
</script>

</div></div></div></body></html>
